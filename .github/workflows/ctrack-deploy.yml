name: CTrack Deploy (release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip installer builds; publish existing artifacts"
        required: false
        default: false
        type: boolean
      skip_edge:
        description: "Skip Supabase Edge Function deploy"
        required: false
        default: false
        type: boolean
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: windows-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: czwfeqheduofviockrab
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN || github.token }}
      GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN || github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Deploy Edge Functions + publish GitHub Release
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "stable" }
          $notes = "${{ github.event.inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes) -and "${{ github.ref_type }}" -eq "tag") {
            $notes = "Release ${{ github.ref_name }}"
          }
          $skipBuild = "${{ github.event.inputs.skip_build }}" -eq "true"
          $skipEdge = "${{ github.event.inputs.skip_edge }}" -eq "true"

          $args = @{
            Channel = $channel
            ReleaseNotes = $notes
          }
          if ($skipBuild) { $args.SkipBuild = $true }
          if ($skipEdge) { $args.SkipEdge = $true }

          ./scripts/deploy-release.ps1 @args

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ctrack-installers
          path: |
            installer/output/*.exe
            ctrack_nuke/installer/output/*.exe
          retention-days: 30
