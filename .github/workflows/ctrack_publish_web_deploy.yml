name: ctrack_publish_web_deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip installer builds; publish existing artifacts"
        required: false
        default: false
        type: boolean
      skip_edge:
        description: "Skip Supabase Edge Function deploy"
        required: false
        default: false
        type: boolean
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  windows_release:
    name: Windows build and GitHub Release
    runs-on: windows-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: czwfeqheduofviockrab
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Baked into installer release\engine\.env so /auth/link works out of the box
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CTRACK_WEB_URL: ${{ secrets.CTRACK_WEB_URL || 'https://ctrackpublishweb.vercel.app' }}
      CTRACK_AUTH_CALLBACK_URL: ${{ secrets.CTRACK_AUTH_CALLBACK_URL || 'http://127.0.0.1:7777/auth/link' }}
      CTRACK_BUNDLE_STORAGE: ${{ secrets.CTRACK_BUNDLE_STORAGE || '0' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
      HYBRID_STORAGE_PRIMARY_ENDPOINT: ${{ secrets.HYBRID_STORAGE_PRIMARY_ENDPOINT }}
      HYBRID_STORAGE_PRIMARY_ACCESS_KEY: ${{ secrets.HYBRID_STORAGE_PRIMARY_ACCESS_KEY }}
      HYBRID_STORAGE_PRIMARY_SECRET_KEY: ${{ secrets.HYBRID_STORAGE_PRIMARY_SECRET_KEY }}
      HYBRID_STORAGE_PRIMARY_BUCKET: ${{ secrets.HYBRID_STORAGE_PRIMARY_BUCKET }}
      HYBRID_STORAGE_PRIMARY_REGION: ${{ secrets.HYBRID_STORAGE_PRIMARY_REGION }}
      GITHUB_TOKEN: ${{ secrets.CTRACK_GH_TOKEN || github.token }}
      GITHUB_RELEASE_TOKEN: ${{ secrets.CTRACK_GH_TOKEN || github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CTRACK_CODESIGN_PFX_BASE64: ${{ secrets.CTRACK_CODESIGN_PFX_BASE64 }}
      CTRACK_CODESIGN_PASSWORD: ${{ secrets.CTRACK_CODESIGN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase anon key for bundled .env
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Missing secret VITE_SUPABASE_URL (or SUPABASE_URL)"
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw "Missing secret VITE_SUPABASE_ANON_KEY — required to bake engine/.env into the installer"
          }
          Write-Host "Supabase URL ok; anon key length=$($env:VITE_SUPABASE_ANON_KEY.Length)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: engine-go/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          CTRACK_SKIP_POSTINSTALL_RUNTIME: "1"
        run: npm ci

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Sync version, build installers, publish release
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $channel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "stable" }
          $notes = "${{ github.event.inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes) -and "${{ github.ref_type }}" -eq "tag") {
            $notes = "Release ${{ github.ref_name }}"
          }
          $skipBuild = "${{ github.event.inputs.skip_build }}" -eq "true"
          $skipEdge = "${{ github.event.inputs.skip_edge }}" -eq "true"

          $args = @{
            Channel = $channel
            ReleaseNotes = $notes
          }
          if ($skipBuild) { $args.SkipBuild = $true }
          if ($skipEdge) { $args.SkipEdge = $true }

          ./scripts/deploy-release.ps1 @args

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ctrack-installers
          path: |
            installer/output/*.exe
            ctrack_nuke/installer/output/*.exe
          retention-days: 30
